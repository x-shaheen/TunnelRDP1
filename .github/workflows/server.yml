name: Automated Super Cloud Builder
on: workflow_dispatch

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform Environment
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Initialize and Verify Infrastructure
      run: |
        echo "⚡ Initializing Terraform Core 2026/2027 ⚡"
        terraform -v

    - name: Launch Free Linux Server & Connect Tunnel
      uses: mxschmitt/action-tmate@v3
      
