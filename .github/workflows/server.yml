name: Provision & Publish Dev Instances (tmate)
on:
  workflow_dispatch:

concurrency:
  group: provision-dev-instances-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  Server_1:
    name: Server_1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INSTANCE_NAME: server-1
      SOCKET_PATH: /tmp/tmate-server-1.sock
      CONN_FILE: ${{ github.workspace }}/connection_link_server_1.txt
      KEEPALIVE_SECONDS: 21600
      TMATE_START_TIMEOUT: 60
      TMATE_RETRIES: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y --no-install-recommends tmate openssh-client jq coreutils timeout psmisc
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Generate silent ed25519 SSH keypair
        run: |
          set -euo pipefail
          umask 077
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          chmod 600 ~/.ssh/id_ed25519
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Start tmate session with retries and capture connection
        run: |
          set -euo pipefail
          SOCK="${SOCKET_PATH}"
          CONN_FILE="${CONN_FILE}"
          TMATE_SSH=""
          TMATE_WEB=""
          TMATE_SSH_FP=""
          attempt=0
          rm -f "${SOCK}"
          while [ $attempt -lt "${TMATE_RETRIES}" ]; do
            attempt=$((attempt+1))
            tmate -S "${SOCK}" new-session -d || true
            ready=0
            for i in $(seq 1 "${TMATE_START_TIMEOUT}"); do
              TMATE_SSH=$(tmate -S "${SOCK}" display -p '#{tmate_ssh}' 2>/dev/null || true)
              TMATE_WEB=$(tmate -S "${SOCK}" display -p '#{tmate_web}' 2>/dev/null || true)
              TMATE_SSH_FP=$(tmate -S "${SOCK}" display -p '#{tmate_ssh_fingerprint}' 2>/dev/null || true)
              if [ -n "${TMATE_SSH}" ]; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "${ready}" -eq 1 ]; then
              break
            fi
            pkill -f "tmate.*${SOCK}" || true
            sleep 2
          done

          if [ -z "${TMATE_SSH}" ]; then
            echo "ERROR: tmate failed to provide an SSH endpoint" >&2
            exit 1
          fi

          umask 077
          {
            echo "instance=${INSTANCE_NAME}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tmate_ssh=${TMATE_SSH}"
            echo "tmate_web=${TMATE_WEB}"
            echo "tmate_ssh_fingerprint=${TMATE_SSH_FP}"
          } > "${CONN_FILE}"
          chmod 600 "${CONN_FILE}"

          # Print the live connection to standard output with clear markers for easy copying
          echo "==== SERVER LIVE CONNECTION ===="
          echo "${TMATE_SSH}"
          echo "==== END SERVER LIVE CONNECTION ===="

      - name: Upload connection artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: connection-server-1
          path: ${{ env.CONN_FILE }}

      - name: Spawn background keepalive loop (nohup) and foreground 6h wait
        run: |
          set -euo pipefail
          nohup bash -c 'while true; do sleep 300; done' >/dev/null 2>&1 & disown || true
          timeout --foreground "${KEEPALIVE_SECONDS}" bash -c 'while true; do sleep 300; done'
        timeout-minutes: 360

      - name: Finalize (keeps minimal non-sensitive audit info)
        if: always()
        run: |
          set -euo pipefail
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${CONN_FILE}"
          chmod 600 "${CONN_FILE}"

